name: Set up Godot
description: Installs the Godot editor and the matching export templates for headless CI builds (cached between runs).

inputs:
  version:
    description: Godot release without the "-stable" suffix, for example 4.7.2
    required: true

outputs:
  template-version:
    description: Export template folder name, for example 4.7.2.stable
    value: ${{ steps.info.outputs.template_version }}

runs:
  using: composite
  steps:
    - name: Restore Godot cache
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot-bin
          ~/.local/share/godot/export_templates
        key: godot-${{ runner.os }}-${{ inputs.version }}-stable-v1

    - name: Download Godot editor and export templates
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
        mkdir -p "$HOME/godot-bin"

        echo "Downloading Godot ${GODOT_VERSION} editor"
        curl -fsSL --retry 5 --retry-delay 5 -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d "$HOME/godot-bin"
        mv "$HOME/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
        chmod +x "$HOME/godot-bin/godot"

        echo "Downloading export templates"
        curl -fsSL --retry 5 --retry-delay 5 -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
        unzip -q /tmp/templates.tpz -d /tmp/templates

        TPL_DIR="$("$HOME/godot-bin/godot" --headless --version 2>/dev/null | head -n1 | sed -nE 's/^([0-9]+\.[0-9]+(\.[0-9]+)?\.stable).*/\1/p')"
        if [ -z "$TPL_DIR" ]; then
          TPL_DIR="${GODOT_VERSION}.stable"
        fi
        mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_DIR}"
        mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${TPL_DIR}/"
        rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates

    - name: Expose Godot
      id: info
      shell: bash
      run: |
        set -euo pipefail
        echo "$HOME/godot-bin" >> "$GITHUB_PATH"
        TPL_DIR="$("$HOME/godot-bin/godot" --headless --version 2>/dev/null | head -n1 | sed -nE 's/^([0-9]+\.[0-9]+(\.[0-9]+)?\.stable).*/\1/p')"
        if [ -z "$TPL_DIR" ]; then
          TPL_DIR="${{ inputs.version }}.stable"
        fi
        echo "template_version=${TPL_DIR}" >> "$GITHUB_OUTPUT"
        echo "Godot: $("$HOME/godot-bin/godot" --headless --version 2>/dev/null | head -n1)"
        ls "$HOME/.local/share/godot/export_templates/${TPL_DIR}" | head -n 40

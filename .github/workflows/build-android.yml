name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build the release APK and AAB"
        type: boolean
        default: true

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Change this one line to move the whole pipeline to another Godot release (without "-stable").
  GODOT_VERSION: "4.7.2"
  JAVA_VERSION: "17"
  # Used only if the versions cannot be read from the Godot Android build template.
  ANDROID_FALLBACK_BUILD_TOOLS: "35.0.1"
  ANDROID_FALLBACK_PLATFORM: "35"
  ANDROID_FALLBACK_NDK: "28.1.13356709"
  # Added to the GitHub run number to form the Android versionCode. Raise it if you already published builds.
  VERSION_CODE_OFFSET: "0"

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project resources
        run: timeout 600 godot --headless --path . --import

      - name: Check that every script and scene loads
        run: godot --headless --path . --script res://tools/ci_check.gd

  smoke-test:
    name: Headless smoke test (non-blocking)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project resources
        run: timeout 600 godot --headless --path . --import

      - name: Play the game headless for 50 seconds of game time
        run: |
          set -o pipefail
          timeout 900 godot --headless --path . --fixed-fps 60 --quit-after 3000 -- --ci-autostart 2>&1 | tee "$RUNNER_TEMP/smoke.log"

      - name: Fail on script errors
        run: |
          if grep -E "SCRIPT ERROR|Parse Error|Nonexistent function|Invalid (call|assignment|access|get index|set index)" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::Script errors were reported during the smoke run (see log above)."
            exit 1
          fi
          echo "No script errors reported."

  build:
    name: Build Android (APK + AAB)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_RELEASE: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_release) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot
        id: godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-${{ hashFiles('export_presets.cfg') }}
          restore-keys: |
            gradle-${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-

      - name: Install the Godot Android build template
        run: |
          set -euo pipefail
          TPL_DIR="${{ steps.godot.outputs.template-version }}"
          SRC="$HOME/.local/share/godot/export_templates/${TPL_DIR}/android_source.zip"
          if [ ! -f "$SRC" ]; then
            echo "::error::android_source.zip not found in the export templates for ${TPL_DIR}"
            ls -la "$HOME/.local/share/godot/export_templates/${TPL_DIR}" || true
            exit 1
          fi
          rm -rf android/build
          mkdir -p android/build
          unzip -q "$SRC" -d android/build
          echo "${TPL_DIR}" > android/.build_version
          touch android/build/.gdignore
          echo "Installed build template ${TPL_DIR}"

      - name: Install the Android SDK packages the template needs
        run: |
          set -euo pipefail
          CFG=android/build/config.gradle
          pick() { sed -nE "$1" "$CFG" | sed -n "1p"; }
          BUILD_TOOLS="$(pick "s/^[[:space:]]*buildTools[[:space:]]*:[[:space:]]*'([^']+)'.*/\1/p")"
          COMPILE_SDK="$(pick "s/^[[:space:]]*compileSdk[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p")"
          NDK="$(pick "s/^[[:space:]]*ndkVersion[[:space:]]*:[[:space:]]*'([^']+)'.*/\1/p")"
          BUILD_TOOLS="${BUILD_TOOLS:-$ANDROID_FALLBACK_BUILD_TOOLS}"
          COMPILE_SDK="${COMPILE_SDK:-$ANDROID_FALLBACK_PLATFORM}"
          NDK="${NDK:-$ANDROID_FALLBACK_NDK}"
          echo "build-tools ${BUILD_TOOLS}, platform android-${COMPILE_SDK}, NDK ${NDK}"

          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(command -v sdkmanager)"
          fi
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "build-tools;${BUILD_TOOLS}" \
            "platforms;android-${COMPILE_SDK}" \
            "cmake;3.10.2.4988404" \
            "ndk;${NDK}" > /dev/null
          echo "Installed Android SDK packages"

      - name: Configure Godot for Android exports and create the debug keystore
        run: |
          set -euo pipefail
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

          MM="$(godot --headless --version 2>/dev/null | head -n1 | sed -nE 's/^([0-9]+\.[0-9]+).*/\1/p')"
          mkdir -p "$HOME/.config/godot"
          for name in "editor_settings-4.tres" "editor_settings-${MM}.tres"; do
            cat > "$HOME/.config/godot/${name}" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${RUNNER_TEMP}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          done
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${RUNNER_TEMP}/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Prepare release signing
        id: signing
        if: env.BUILD_RELEASE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_ALIAS:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            # fail early (and clearly) if the secrets do not match the keystore
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" > /dev/null
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=${RUNNER_TEMP}/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${KEYSTORE_ALIAS}"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "mode=release key" >> "$GITHUB_OUTPUT"
            echo "Release builds will be signed with your release key."
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Tag builds must be signed. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS and ANDROID_KEYSTORE_PASSWORD repository secrets (see README)."
              exit 1
            fi
            echo "::warning::Release signing secrets are not configured, so release builds are signed with the debug key. They install fine but cannot be uploaded to Google Play."
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=${RUNNER_TEMP}/debug.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "mode=debug key (no secrets configured)" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the app version
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          fi
          CODE=$(( GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET ))
          sed -i -E "s|^version/code=.*|version/code=${CODE}|; s|^version/name=.*|version/name=\"${NAME}\"|" export_presets.cfg
          echo "VERSION_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${CODE}" >> "$GITHUB_ENV"
          echo "App version ${NAME} (code ${CODE})"

      - name: Import project resources
        run: timeout 600 godot --headless --path . --import

      - name: Export debug APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android Debug APK" "$PWD/build/lambda-wars-${VERSION_NAME}-debug.apk" 2>&1 | tee "$RUNNER_TEMP/export-debug.log"
          test -s "build/lambda-wars-${VERSION_NAME}-debug.apk"

      - name: Export release APK
        if: env.BUILD_RELEASE == 'true'
        run: |
          set -o pipefail
          godot --headless --verbose --path . --export-release "Android Release APK" "$PWD/build/lambda-wars-${VERSION_NAME}-release.apk" 2>&1 | tee "$RUNNER_TEMP/export-release-apk.log"
          test -s "build/lambda-wars-${VERSION_NAME}-release.apk"

      - name: Export release AAB
        if: env.BUILD_RELEASE == 'true'
        run: |
          set -o pipefail
          godot --headless --verbose --path . --export-release "Android Release AAB" "$PWD/build/lambda-wars-${VERSION_NAME}-release.aab" 2>&1 | tee "$RUNNER_TEMP/export-release-aab.log"
          test -s "build/lambda-wars-${VERSION_NAME}-release.aab"

      - name: Verify signatures and write checksums
        run: |
          set -euo pipefail
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          APKSIGNER="$ANDROID_HOME/build-tools/${BT}/apksigner"
          cd build
          for apk in *.apk; do
            echo "== ${apk}"
            "$APKSIGNER" verify --print-certs "$apk" | sed -n "1,3p"
          done
          for aab in *.aab; do
            [ -e "$aab" ] || continue
            echo "== ${aab}"
            jarsigner -verify "$aab" | sed -n "1,2p" || true
          done
          sha256sum *.apk *.aab 2> /dev/null > SHA256SUMS.txt || sha256sum *.apk > SHA256SUMS.txt
          {
            echo "## Lambda Wars ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo
            echo "Godot ${GODOT_VERSION} - signing: ${{ steps.signing.outputs.mode || 'debug builds only' }}"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in *.apk *.aab; do
              [ -e "$f" ] || continue
              echo "| ${f} | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-wars-android-${{ env.VERSION_NAME }}
          path: |
            build/*.apk
            build/*.aab
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/debug.keystore"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*-release.apk
            release/*-release.aab
            release/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
